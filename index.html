<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AR Theme Scene</title>
    <!-- A-Frame and AR.js Libraries -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
      /* Requirement 5: Status Banner Styling */
      #status-banner {
        position: fixed;
        top: 15px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 999;
        padding: 12px 24px;
        font-family: sans-serif;
        font-weight: bold;
        font-size: 16px;
        color: white;
        background-color: #e74c3c;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        transition: background-color 0.3s ease;
      }
    </style>
  </head>
  <body style="margin: 0; overflow: hidden;">
    
    <!-- Status Banner -->
    <div id="status-banner">Searching for Hiro Marker...</div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <!-- Requirement 1: Hiro Marker Scene -->
      <a-marker preset="hiro" id="hiro-marker" raycaster="objects: .clickable" cursor="fuse: false; rayOrigin: mouse;">
        
        <!-- Object 1 (Primitive): Cylinder Base -->
        <a-cylinder position="0 0 0" radius="0.8" height="0.1" color="#333333"></a-cylinder>

        <!-- Object 2 (Primitive): Interactive Ball with floating animation -->
        <!-- Requirement 2 & 4: Animation + Color Change -->
        <a-sphere id="color-ball" class="clickable" position="-0.7 0.5 0" radius="0.25" color="#EF2D5E"
                  animation="property: position; to: -0.7 0.8 0; dir: alternate; loop: true; dur: 1500; easing: easeInOutSine">
        </a-sphere>

        <!-- Object 3 (Primitive): Interactive Box with rotation animation -->
        <!-- Requirement 2 & 4: Animation + Custom Component (Grow/Toggle) -->
        <a-box id="grow-box" class="clickable" position="0.7 0.4 0" width="0.4" height="0.4" depth="0.4" color="#3498db"
               animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear"
               grow-on-click>
        </a-box>

        <!-- Object 4: Requirement 3 - 3D Model (glTF/GLB) -->
        <!-- Model: "Astronaut" by Khronos Group (Creative Commons / Open License) -->
        <a-gltf-model src="
